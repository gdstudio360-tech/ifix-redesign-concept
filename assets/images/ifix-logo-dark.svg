<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 150"
     role="img"
     aria-label="iFix Property">

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2cf73"/>
      <stop offset="55%" stop-color="#dfad45"/>
      <stop offset="100%" stop-color="#b67c27"/>
    </linearGradient>
  </defs>

  <!-- i -->
  <circle cx="38" cy="31" r="10" fill="url(#gold)"/>
  <rect x="29" y="49" width="18" height="64" rx="2" fill="#f5f5f2"/>

  <!-- Fix -->
  <text x="60"
        y="113"
        font-family="Arial, Helvetica, sans-serif"
        font-size="92"
        font-weight="900"
        letter-spacing="-7"
        fill="#f5f5f2">Fix</text>

  <!-- PROPERTY -->
  <text x="63"
        y="140"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-weight="700"
        letter-spacing="11"
        fill="#8f9698">PROPERTY</text>

  <!-- tiny gold accent -->
  <rect x="367" y="128" width="44" height="3" rx="1.5" fill="url(#gold)"/>

</svg>
